name: Weekly low-stock email

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"
      timezone: "Europe/Copenhagen"

jobs:
  send-low-stock-email:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Opsæt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installer dependencies
        run: npm install

      - name: Kontroller JavaScript
        run: node --check ./scripts/send-low-stock-email.mjs

      - name: Debug schedule
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC time:"
          date -u
          echo "Copenhagen time:"
          TZ=Europe/Copenhagen date

      - name: Send indkøbsliste
        run: node ./scripts/send-low-stock-email.mjs
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_DATABASE_AUTH: ${{ secrets.FIREBASE_DATABASE_AUTH }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}

          DEFAULT_REORDER: ${{ secrets.DEFAULT_REORDER }}
