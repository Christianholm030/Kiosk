name: Weekly low-stock email

on:
  workflow_dispatch:

  schedule:
    - cron: '0 2 * * 1'
      timezone: 'Europe/Copenhagen'

permissions:
  contents: read

jobs:
  send-low-stock-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Opsæt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer dependencies
        run: npm ci

      - name: Kontrollér JavaScript-syntaks
        run: node --check send-low-stock-email.mjs

      - name: Send indkøbsliste
        run: node send-low-stock-email.mjs
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_DATABASE_AUTH: ${{ secrets.FIREBASE_DATABASE_AUTH }}
          DEFAULT_REORDER: ${{ secrets.DEFAULT_REORDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
